name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Gate model:
#   upstream-evidence -> evidence-audit -> build/test (parallel OS matrix) -> integration-gate
# The gate jobs are intentionally deterministic repository checks. They do not claim
# physical hardware verification; they only prevent unsupported evidence from passing CI.
jobs:
  upstream-evidence:
    name: Agent - Upstream Evidence Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned BWM upstream commit exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('compatibility/bwm.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          repo = data['upstream']['repository']
          commit = data['upstream']['commit']
          if len(commit) != 40 or any(c not in '0123456789abcdef' for c in commit.lower()):
              raise SystemExit(f'Invalid upstream commit SHA: {commit!r}')
          print(f'Checking immutable upstream baseline: {repo}@{commit}')
          PY
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data = json.loads(Path('compatibility/bwm.json').read_text(encoding='utf-8'))
          repo = data['upstream']['repository']
          commit = data['upstream']['commit']
          url = f'https://github.com/{repo}.git'
          # git ls-remote <repo> <sha> only searches advertised refs; it does
          # not prove that an arbitrary reachable commit exists. Fetch the
          # pinned object explicitly and verify that Git can resolve it.
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', url, commit], check=True)
          subprocess.run(['git', 'cat-file', '-e', f'{commit}^{{commit}}'], check=True)
          print(f'UPSTREAM VERIFIED: {repo}@{commit}')
          PY

  evidence-audit:
    name: Agent - Evidence / Claim Audit
    runs-on: ubuntu-latest
    needs: upstream-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('compatibility/bwm.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          status = data['status']
          caps = data['capabilities']
          charger = data['chargerPolicy']
          upstream = data['upstream']

          allowed_statuses = {
              'SOURCE_VERIFIED_NOT_HARDWARE_VERIFIED',
              'PARTIAL_HARDWARE_VERIFIED',
              'HARDWARE_VERIFIED',
          }
          if status not in allowed_statuses:
              raise SystemExit(f'Unknown evidence status: {status}')

          # A source-only baseline may not silently claim physical verification.
          if status == 'SOURCE_VERIFIED_NOT_HARDWARE_VERIFIED':
              forbidden = []
              for key, value in caps.items():
                  if isinstance(value, str) and 'HARDWARE_VERIFIED' in value and 'NOT_HARDWARE_VERIFIED' not in value:
                      forbidden.append(f'capabilities.{key}={value}')
              if forbidden:
                  raise SystemExit('Unsupported hardware claims:\n' + '\n'.join(forbidden))

          if charger.get('automaticConfiguration') == 'ENABLED':
              raise SystemExit('Charger automatic configuration must not be enabled without verified hardware read/write evidence.')

          for key in ('repository', 'commit', 'ciStatus', 'ciMeaning'):
              if not upstream.get(key):
                  raise SystemExit(f'Missing upstream evidence field: {key}')

          if 'HARDWARE_VERIFIED' in data.get('evidenceRule', '') and not data.get('evidenceRule'):
              raise SystemExit('Evidence rule is inconsistent.')

          print(f'EVIDENCE GATE PASSED: status={status}, upstream={upstream["repository"]}@{upstream["commit"]}')
          PY

  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: evidence-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj

      - name: Restore CLI
        run: dotnet restore src/PM5Control.Cli/PM5Control.Cli.csproj

      - name: Restore simulator
        run: dotnet restore src/PM5Control.Simulator/PM5Control.Simulator.csproj

      - name: Build Release tests
        run: dotnet build tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-restore

      - name: Build Release CLI
        run: dotnet build src/PM5Control.Cli/PM5Control.Cli.csproj --configuration Release --no-restore

      - name: Build Release simulator
        run: dotnet build src/PM5Control.Simulator/PM5Control.Simulator.csproj --configuration Release --no-restore

      - name: Test Release
        run: dotnet test tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: ${{ matrix.os }} test results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 90

      - name: Restore desktop
        if: matrix.os == 'windows-latest'
        run: dotnet restore src/PM5Control.Desktop/PM5Control.Desktop.csproj

      - name: Publish standalone Windows EXE
        if: matrix.os == 'windows-latest'
        run: >-
          dotnet publish src/PM5Control.Desktop/PM5Control.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/PM5Control

      - name: Upload standalone Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PM5-Control-Center-Windows
          path: publish/PM5Control/PM5Control.Desktop.exe
          if-no-files-found: error
          retention-days: 90

  integration-gate:
    name: Gate - Integration / Release Readiness
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [upstream-evidence, evidence-audit, build-test]
    steps:
      - name: Evaluate all gates
        shell: bash
        env:
          UPSTREAM_RESULT: ${{ needs.upstream-evidence.result }}
          EVIDENCE_RESULT: ${{ needs.evidence-audit.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
        run: |
          set -euo pipefail
          echo "Upstream evidence: ${UPSTREAM_RESULT}"
          echo "Evidence audit:    ${EVIDENCE_RESULT}"
          echo "Build/test matrix: ${BUILD_RESULT}"
          if [[ "${UPSTREAM_RESULT}" != "success" || "${EVIDENCE_RESULT}" != "success" || "${BUILD_RESULT}" != "success" ]]; then
            echo 'INTEGRATION GATE: FAIL'
            echo 'No release-readiness pass is allowed until every required gate is successful.'
            exit 1
          fi
          echo 'INTEGRATION GATE: PASS'
