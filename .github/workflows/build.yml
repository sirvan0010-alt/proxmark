name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PM5_APP_VERSION: 0.6.0

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj

      - name: Restore CLI
        run: dotnet restore src/PM5Control.Cli/PM5Control.Cli.csproj

      - name: Restore simulator
        run: dotnet restore src/PM5Control.Simulator/PM5Control.Simulator.csproj

      - name: Build Release tests
        run: dotnet build tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-restore

      - name: Build Release CLI
        run: dotnet build src/PM5Control.Cli/PM5Control.Cli.csproj --configuration Release --no-restore

      - name: Build Release simulator
        run: dotnet build src/PM5Control.Simulator/PM5Control.Simulator.csproj --configuration Release --no-restore

      - name: Test Release
        run: dotnet test tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: ${{ matrix.os }} test results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 90

      - name: Restore desktop
        if: matrix.os == 'windows-latest'
        run: dotnet restore src/PM5Control.Desktop/PM5Control.Desktop.csproj

      - name: Publish standalone Windows EXE
        if: matrix.os == 'windows-latest'
        run: >-
          dotnet publish src/PM5Control.Desktop/PM5Control.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:InformationalVersion=${{ env.PM5_APP_VERSION }}+${{ github.sha }}
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/PM5Control

      - name: Create Windows ZIP package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path publish/PM5Control/* -DestinationPath publish/PM5Control-Windows.zip

      - name: Upload standalone Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: PM5-Control-Center-Windows
          path: publish/PM5Control/PM5Control.Desktop.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Windows ZIP package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: PM5-Control-Center-Windows-ZIP
          path: publish/PM5Control-Windows.zip
          if-no-files-found: error
          retention-days: 90
