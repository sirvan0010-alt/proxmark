name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj

      - name: Restore CLI
        run: dotnet restore src/PM5Control.Cli/PM5Control.Cli.csproj

      - name: Build Release tests
        run: dotnet build tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-restore

      - name: Build Release CLI
        run: dotnet build src/PM5Control.Cli/PM5Control.Cli.csproj --configuration Release --no-restore

      - name: Test Release
        run: dotnet test tests/PM5Control.Core.Tests/PM5Control.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: ${{ matrix.os }} test results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 90
