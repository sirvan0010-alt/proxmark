name: Feature proposal
description: Propose a new Proxmark5 Control Center function, workflow improvement or automation.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals may be generated by FEATURE_ARCHITECT_AGENT or submitted by a human.
        A proposal is not authorization for a risky hardware operation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed function
      description: Describe the smallest useful function and workflow.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / source
      description: Link repository evidence, upstream commits, captures or documentation. Mark unsupported claims as HYPOTHESIS or UNKNOWN.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Real hardware required
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Security risk
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Tests, CI checks and hardware verification required.
    validations:
      required: true

  - type: textarea
    id: hard_stop
    attributes:
      label: Hard stop
      description: What must not be implemented until stronger evidence, authorization or hardware verification exists?
    validations:
      required: true
